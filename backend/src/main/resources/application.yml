# ITE4120 — Unemployment Support (SUPPORT.01).
# Production-shaped defaults; the `local` profile below (application-local.yml)
# switches on mock auth and the imitated registries.

server:
  port: ${SUPPORT_PORT:18440}

spring:
  application:
    name: ite4120-unemployment-support
  datasource:
    url: ${SUPPORT_DB_URL:jdbc:postgresql://localhost:18520/support}
    username: ${SUPPORT_DB_USER:support}
    password: ${SUPPORT_DB_PASSWORD:support}
    hikari:
      # The pool's default session user — what the core.sys_columns() trigger stamps
      # into sys_created_by / sys_modified_by when nobody is signed in (Liquibase,
      # demo data, tests). Inside a request, JdbcConfig overrides it per connection
      # with the signed-in user via core.set_user().
      connection-init-sql: "select set_config('core.client_identifier', 'social services', false)"
  liquibase:
    change-log: classpath:db/changelog.xml
    default-schema: support
    liquibase-schema: public
    # The demo context seeds sample rows. Drop it to start empty.
    contexts: demo
    parameters:
      app-username: ${SUPPORT_DB_USER:support}
      viewer-username: ${SUPPORT_DB_USER:support}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Fail closed by default: no mock auth means every /api request is rejected.
auth:
  mock:
    enabled: false

support:
  # The local government this component serves; residence checks compare against it.
  municipality: Tallinn
  registry:
    # http (default) — plain HTTPS+JSON against `url`; xroad — forge-xroad transport.
    mode: http
    url: http://localhost:18440/mock-registry
    # The built-in imitated registries; enabled only in the local profile.
    mock-server: false
